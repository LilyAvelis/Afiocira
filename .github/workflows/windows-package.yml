name: Windows package validation
on:
  pull_request:
  workflow_dispatch:
jobs:
  windows-x64:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        shell: pwsh
        run: |
          choco install zig --version=0.15.2 --yes --no-progress
          choco install innosetup --version=6.7.1 --yes --no-progress
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup default 1.95.0
      - name: Build and stage
        shell: pwsh
        run: |
          $sep = [char]31
          $env:CARGO_ENCODED_RUSTFLAGS = '-C' + $sep + 'target-feature=+crt-static' + $sep + "--remap-path-prefix=$env:GITHUB_WORKSPACE=AFIOCIRA_SOURCE"
          cargo build --locked --release --workspace --target-dir target/distribution
          ./scripts/stage-windows-release.ps1
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe','C:\Program Files\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler not found' }
          & $iscc.FullName scripts/Afiocira.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check and test
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          $env:APPDATA = "$env:RUNNER_TEMP\afio-config"
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $env:PATH = "$(Resolve-Path target/package-2.0.0/yazi);$env:PATH"
          New-Item -ItemType Directory -Force target/debug/deps/fonts | Out-Null
          Copy-Item target/package-2.0.0/fonts/* target/debug/deps/fonts
          cargo test --locked --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: Afiocira-2.0.0-Windows-x64
          path: target/release-assets/*
          if-no-files-found: error
