[package]
name = "photo-cli"
version = "3.0.0"
edition = "2024"
license = "MIT"

[dependencies]
photo-core = { path = "../photo-core" }
interprocess = "2.4.4"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
