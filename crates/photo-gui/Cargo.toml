[package]
name = "photo-gui"
version = "1.0.0"
edition = "2024"
license = "MIT"

[dependencies]
photo-core = { path = "../photo-core" }
eframe = { version = "0.36.0", default-features = false, features = ["glow", "default_fonts"] }
egui-winit = { version = "0.36.0", default-features = false, features = ["clipboard"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
egui_extras = { version = "0.36.0", default-features = false, features = ["svg"] }
egui-lucide = "0.1.0"
egui_tty = "0.2.0"
portable-pty = "0.9.0"
interprocess = "2.4.4"
serde_json = "1"
notify = "8.2.1"
toml_edit = "0.25.19"
